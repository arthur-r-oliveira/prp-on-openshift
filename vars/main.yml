# vars/main.yml
# Shared across every topology. Topology-specific vars (networks, node
# lists, NIC layout, addressing) live in vars/topologies/<mode>.yml -
# sno_playbook.yml loads vars/main.yml then vars/topologies/{{ sno_topology }}.yml.

# Which deployment this run builds. One playbook, three test cases:
#   single             - Test Case 1: one plain SNO, no PRP
#   dual-sidecar-prp    - Test Case 2: two SNOs, PRP as an isolated side network
#   single-primary-prp  - Test Case 3: one SNO, PRP IS the primary network under br-ex
# See docs/installation.md, docs/prp-test-case.md, and
# docs/spec-test-case-3-prp-primary.md respectively.
sno_topology: "dual-sidecar-prp"

# VM sizing - identical for every SNO node regardless of topology.
# 8 vCPU is a hard floor: the agent-based installer's master-role
# validation requires >=8 CPU cores or the host is marked "insufficient"
# and bootstrap never starts.
sno_vcpu: 8
sno_ram_mb: 16384
sno_disk_gb: 120
sno_lvms_disk_gb: 50

# Shared cluster domain (each node still gets its own cluster name/subdomain)
sno_domain: "apps.lab.corp"

# Base directory for VM disk images/ISOs. Deliberately NOT under /root or
# on the root filesystem: a SNO node's disk can easily reach 30GB+ once
# real installation starts writing data, so this must live on a
# filesystem with real headroom, and it must be traversable (mode 0711)
# by the unprivileged 'qemu' user libvirt runs VMs as.
sno_storage_base: "/home/libvirt-images"

# OpenShift Settings
# 5.0.0-rc.2 is a pre-GA release candidate - it has no "latest-5.0" alias
# (that convention only exists for GA channels), so ocp_release_url pins
# the exact RC path directly. openshift-install itself resolves and
# fetches its own matching RHCOS/agent ISO internally at "agent create
# image" time - there is no separate agent_iso_url to set.
openshift_version: "5.0.0-rc.2"
ocp_release_url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ openshift_version }}"
oc_url: "{{ ocp_release_url }}/openshift-client-linux.tar.gz"
openshift_install_url: "{{ ocp_release_url }}/openshift-install-linux.tar.gz"
pull_secret_path: "/root/secrets/pull-secret.json"
ssh_public_key_path: "/root/secrets/sno_id_ed25519.pub"

# Mirror registry for disconnected Day-2 operator installation.
# A pruned catalog index (NMState-only) and all operator images are
# pre-mirrored here so the SNO nodes pull from the LAN instead of the
# internet, avoiding the 10-20 minute catalog-pod startup that was
# causing CI timeouts. See scripts/mirror-nmstate-operator.sh.
#
# The default below is a placeholder, not a resolvable host. A real lab
# supplies its own registry via MIRROR_REGISTRY_HOST so no site-specific
# hostname is committed here; in CI that comes from a repository secret.
# Leaving it unset means the catalog pod cannot pull and the Day-2 install
# falls back to the upstream operator.
mirror_registry_host: "{{ lookup('env', 'MIRROR_REGISTRY_HOST') | default('bastion.lab.local', true) }}"
mirror_registry_port: 8443
mirror_registry: "{{ mirror_registry_host }}:{{ mirror_registry_port }}"
mirror_registry_ca_path: "/root/secrets/mirror-registry/ca.crt"
mirror_registry_user: "mirror"
mirror_registry_pass: "mirror-pass"
