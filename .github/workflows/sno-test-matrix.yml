name: SNO test matrix (wipe + single + dual-sidecar-prp)

on:
  workflow_dispatch: {}

jobs:
  test-matrix:
    runs-on: [self-hosted, kvm-prp-lab]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # The benchmark phase applies this repo's k8s manifests. Without it
      # test-prp-bench.sh falls through to "use whatever is already
      # deployed", and the matrix wipes both clusters, so nothing is.
      - uses: actions/checkout@v4
        with:
          repository: arthur-r-oliveira/quarkus-prp-bench
          path: quarkus-prp-bench

      - name: Run the wipe + test-case matrix
        id: matrix
        env:
          # checkout cannot write outside the workspace, so the default
          # sibling-directory guess in test-prp-bench.sh never resolves here.
          PRP_BENCH_REPO: ${{ github.workspace }}/quarkus-prp-bench
          # The repo commits a placeholder registry host, so the lab's real
          # one comes from here. A secret rather than a variable only so it
          # is masked if some future step ever echoes it.
          MIRROR_REGISTRY_HOST: ${{ secrets.MIRROR_REGISTRY_HOST }}
        run: |
          mkdir -p "${{ runner.temp }}/test-results"
          ./scripts/run-test-matrix.sh "${{ runner.temp }}/sno-test-matrix-report.md" 2>&1 \
            | tee "${{ runner.temp }}/test-results/matrix-full.log"
          MATRIX_RC=${PIPESTATUS[0]}
          echo "exit_code=$MATRIX_RC" >> "$GITHUB_OUTPUT"
          exit $MATRIX_RC

      - name: Convert results to JUnit XML
        if: always()
        run: |
          LOG="${{ runner.temp }}/test-results/matrix-full.log"
          ./scripts/to-junit-xml.sh sno-test-matrix < "$LOG" \
            > "${{ runner.temp }}/test-results/sno-test-matrix.xml"

      - name: Generate job summary
        if: always()
        run: |
          REPORT="${{ runner.temp }}/sno-test-matrix-report.md"
          LOG="${{ runner.temp }}/test-results/matrix-full.log"

          PASS_COUNT=$(grep -c '^\- \*\*.*\*\*: PASS' "$REPORT" 2>/dev/null || echo 0)
          FAIL_COUNT=$(grep -c '^\- \*\*.*\*\*: FAIL' "$REPORT" 2>/dev/null || echo 0)
          TOTAL=$((PASS_COUNT + FAIL_COUNT))

          if [ "$FAIL_COUNT" -eq 0 ]; then
            BADGE="![pass](https://img.shields.io/badge/test_matrix-${PASS_COUNT}%2F${TOTAL}_passed-brightgreen)"
          else
            BADGE="![fail](https://img.shields.io/badge/test_matrix-${FAIL_COUNT}%2F${TOTAL}_failed-red)"
          fi

          {
            echo "## $BADGE"
            echo ""
            echo "### Environment"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Host | \`kvm-prp-lab\` |"
            echo "| Runner | \`kvm-prp-lab\` |"
            echo "| Date | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo ""
            echo "### Results by Test Case"
            echo ""

            # Parse the markdown report into a table
            CURRENT_TC=""
            while IFS= read -r line; do
              case "$line" in
                "## Test Case"*)
                  CURRENT_TC="${line#\#\# }"
                  echo "#### ${CURRENT_TC}"
                  echo ""
                  echo "| Status | Phase | Detail |"
                  echo "|--------|-------|--------|"
                  ;;
                "- **"*": PASS"*)
                  phase=$(echo "$line" | sed 's/- \*\*\(.*\)\*\*: PASS.*/\1/')
                  echo "| :white_check_mark: | ${phase} | Passed |"
                  ;;
                "- **"*": FAIL"*)
                  phase=$(echo "$line" | sed 's/- \*\*\(.*\)\*\*: FAIL.*/\1/')
                  detail=$(echo "$line" | sed 's/.*FAIL \(.*\)/\1/' | sed 's/^(//' | sed 's/)$//')
                  echo "| :x: | ${phase} | ${detail} |"
                  ;;
                "## Overall"*)
                  echo ""
                  ;;
                "**PASS**"*|"**FAIL**"*)
                  echo ""
                  echo "### Overall: ${line}"
                  ;;
              esac
            done < "$REPORT"

            echo ""
            echo "---"
            echo "_Full logs available in the uploaded artifact._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sno-test-matrix-report
          path: |
            ${{ runner.temp }}/sno-test-matrix-report.md
            ${{ runner.temp }}/test-results/
            /tmp/sno-test-matrix-logs/**
          retention-days: 30
