name: PRP failover test

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"
    # Burst mode for short-lived labs: every 20 minutes, interleaved with the
    # benchmark's :05/:25/:45 slots so link cuts never overlap. Only fires
    # while the repository variable PRP_CI_BURST is "true" - set it for the
    # life of a lab, delete it when the lab is torn down.
    - cron: "0,20,40 * * * *"

# Same group as the benchmark and Day-2: one job owns the lab's links at a
# time, so a late-starting schedule queues instead of cutting mid-measurement.
concurrency:
  group: prp-bench
  cancel-in-progress: false

jobs:
  prp-failover:
    if: >-
      github.event.schedule != '0,20,40 * * * *' ||
      vars.PRP_CI_BURST == 'true'
    # Which lab to test is a repository variable, so pointing CI at another
    # SNO pair is a settings change, not a commit. Site specifics (kubeconfig
    # paths, node names, NIC names, NODE_EXEC/CUT_METHOD) live in that
    # runner's .env file, never in this public repo.
    runs-on: ${{ fromJSON(vars.PRP_RUNNER_LABELS || '["self-hosted","kvm-prp-lab"]') }}
    # oc-debug node access costs ~10s per call, so allow for the slow path.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Collect cluster info
        id: info
        run: |
          KUBECONFIG_A="${KUBECONFIG_A:-/home/libvirt-images/sno-install/sno-a/auth/kubeconfig}"
          KUBECONFIG_B="${KUBECONFIG_B:-/home/libvirt-images/sno-install/sno-b/auth/kubeconfig}"

          OCP_VERSION_A=$(KUBECONFIG="$KUBECONFIG_A" oc get clusterversion version -o jsonpath='{.status.desired.version}' 2>/dev/null || echo "unknown")
          OCP_VERSION_B=$(KUBECONFIG="$KUBECONFIG_B" oc get clusterversion version -o jsonpath='{.status.desired.version}' 2>/dev/null || echo "unknown")
          NODE_COUNT_A=$(KUBECONFIG="$KUBECONFIG_A" oc get nodes --no-headers 2>/dev/null | wc -l || echo 0)
          NODE_COUNT_B=$(KUBECONFIG="$KUBECONFIG_B" oc get nodes --no-headers 2>/dev/null | wc -l || echo 0)

          echo "ocp_version_a=$OCP_VERSION_A" >> "$GITHUB_OUTPUT"
          echo "ocp_version_b=$OCP_VERSION_B" >> "$GITHUB_OUTPUT"
          echo "node_count_a=$NODE_COUNT_A" >> "$GITHUB_OUTPUT"
          echo "node_count_b=$NODE_COUNT_B" >> "$GITHUB_OUTPUT"

      - name: Run PRP failover test suite
        id: test
        run: |
          mkdir -p "${{ runner.temp }}/test-results"
          ./scripts/test-prp-failover.sh 2>&1 | tee "${{ runner.temp }}/test-results/prp-failover.log"
          TEST_RC=${PIPESTATUS[0]}
          ./scripts/to-junit-xml.sh prp-failover < "${{ runner.temp }}/test-results/prp-failover.log" \
            > "${{ runner.temp }}/test-results/prp-failover.xml"
          exit $TEST_RC

      - name: Generate job summary
        if: always()
        run: |
          LOG="${{ runner.temp }}/test-results/prp-failover.log"
          PASS=$(grep -c '^\[PASS\]' "$LOG" 2>/dev/null || echo 0)
          FAIL=$(grep -c '^\[FAIL\]' "$LOG" 2>/dev/null || echo 0)
          TOTAL=$((PASS + FAIL))

          if [ "$FAIL" -eq 0 ]; then
            BADGE="![pass](https://img.shields.io/badge/PRP_failover-${PASS}%2F${TOTAL}_passed-brightgreen)"
          else
            BADGE="![fail](https://img.shields.io/badge/PRP_failover-${FAIL}%2F${TOTAL}_failed-red)"
          fi

          {
            echo "## $BADGE"
            echo ""
            echo "| Property | sno-a | sno-b |"
            echo "|----------|-------|-------|"
            echo "| OCP version | \`${{ steps.info.outputs.ocp_version_a }}\` | \`${{ steps.info.outputs.ocp_version_b }}\` |"
            echo "| Nodes | ${{ steps.info.outputs.node_count_a }} | ${{ steps.info.outputs.node_count_b }} |"
            echo "| Topology | dual-sidecar-prp | dual-sidecar-prp |"
            echo ""
            echo "### Test Results"
            echo ""
            echo "| Status | Test | Detail |"
            echo "|--------|------|--------|"
            while IFS= read -r line; do
              case "$line" in
                \[PASS\]*)
                  rest="${line#\[PASS\] }"
                  name="${rest%% - *}"
                  detail=""
                  [[ "$rest" == *" - "* ]] && detail="${rest#* - }"
                  echo "| :white_check_mark: | \`${name}\` | ${detail} |"
                  ;;
                \[FAIL\]*)
                  rest="${line#\[FAIL\] }"
                  name="${rest%% - *}"
                  detail=""
                  [[ "$rest" == *" - "* ]] && detail="${rest#* - }"
                  echo "| :x: | \`${name}\` | ${detail} |"
                  ;;
              esac
            done < "$LOG"
            echo ""
            echo "---"
            echo "_Runner: \`${{ runner.name }}\` | $(date -u '+%Y-%m-%d %H:%M UTC')_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prp-failover-results
          path: ${{ runner.temp }}/test-results/
          retention-days: 90
