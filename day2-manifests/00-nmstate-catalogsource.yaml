# Pruned catalog index containing ONLY kubernetes-nmstate-operator,
# served from the local mirror registry on the bastion host. This
# replaces the full registry.redhat.io/redhat/redhat-operator-index:v4.22
# that previously caused 10-20 minute catalog-pod startup times (and
# frequent CI timeouts on sno-b) because parsing+caching 151 operators
# is expensive. The pruned index caches in seconds.
#
# WORKAROUND context (still applies): as of OCP 5.0.0-rc.2,
# kubernetes-nmstate-operator is not published in ANY default catalog.
# The 4.22 redhat-operators index (last 4.x) still carries it and OLM
# on 5.0 installs it fine. Once it appears in OCP 5.0's own catalog,
# delete this CatalogSource and point the Subscription back at
# "redhat-operators".
#
# Mirror refresh: run scripts/mirror-nmstate-operator.sh on the KVM
# host whenever the v4.22 index is updated (roughly every 2 weeks).
#
# The image host below is a PLACEHOLDER, not a resolvable registry, so
# that no site-specific hostname is committed to this public repo.
# scripts/apply-day2-prp.sh substitutes $MIRROR_REGISTRY_HOST at apply
# time. Applying this file directly with `oc apply -f` uses the
# placeholder and the catalog pod will fail to pull.
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: redhat-operators-4-22
  namespace: openshift-marketplace
spec:
  sourceType: grpc
  image: bastion.lab.local:8443/redhat/redhat-operator-index:v4.22-nmstate-only
  displayName: Red Hat Operators (4.22 pruned, NMState only - local mirror)
  publisher: Red Hat
